server 0.pool.ntp.org iburst maxpoll 10
server 1.pool.ntp.org iburst maxpoll 10
server 2.pool.ntp.org iburst maxpoll 10
server 3.pool.ntp.org iburst maxpoll 10
server time.nist.gov iburst maxpoll 10
server ntp.ntsc.ac.cn iburst maxpoll 10

# Allow only time queries, at a limited rate, sending KoD when in excess.
# Allow all local queries (IPv4, IPv6)
restrict default nomodify nopeer noquery limited kod
restrict 127.0.0.1
restrict [::1]

server 127.127.28.2 minpoll 1 maxpoll 1 prefer
fudge 127.127.28.2 refid BDG
